worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Prefer proto from edge TLS (farmhand.famgala.com); fall back to local scheme
  map $http_x_forwarded_proto $fh_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  server {
    listen 80;
    server_name farmhand.famgala.com;
    client_max_body_size 8m;

    # Docker embedded DNS — re-resolve upstream hostnames after container recreate
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
      set $fh_api api:3000;
      proxy_pass http://$fh_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $fh_forwarded_proto;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    location = /health {
      set $fh_api api:3000;
      proxy_pass http://$fh_api/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /admin/ {
      set $fh_admin admin:80;
      proxy_pass http://$fh_admin;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    location /admin {
      return 301 /admin/;
    }

    location /parent/ {
      set $fh_parent parent:80;
      proxy_pass http://$fh_parent;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }

    location = /parent/sw.js {
      set $fh_parent parent:80;
      proxy_pass http://$fh_parent/parent/sw.js;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "no-cache";
      add_header Service-Worker-Allowed "/parent/";
    }

    location /parent {
      return 301 /parent/;
    }

    # Player PWA owns / forever — never redirect to admin/parent
    location / {
      set $fh_player player:80;
      proxy_pass http://$fh_player;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Set-Cookie;
    }
  }
}