# EDGE nginx (TLS terminator) — NOT the Docker FarmHand nginx.
# Gameplay (/) : LAN 192.168.0.0/16 only
# /admin, /parent, /api : public (apps are password-protected)

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

upstream farmhand_app {
  server 192.168.1.109:8080;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name farmhand.famgala.com;

  ssl_certificate /etc/letsencrypt/live/farmhand.famgala.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/farmhand.famgala.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 10m;

  # Parent + Admin UIs — allow internet
  location /admin/ {
    proxy_pass http://farmhand_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location = /admin {
    return 301 /admin/;
  }

  location /parent/ {
    proxy_pass http://farmhand_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location = /parent {
    return 301 /parent/;
  }

  # API used by Admin/Parent (and LAN player) — keep public so remote parents work
  location /api/ {
    proxy_pass http://farmhand_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Player gameplay PWA — LAN only
  location / {
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://farmhand_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name farmhand.famgala.com;
  return 301 https://$host$request_uri;
}